# Two machines with a shared data directory, one active and one standby (see docs/DEPLOY.md section 9).
# The standby answers every /api/ request with 503 until it takes over, so nginx simply tries the other server.
# Use this upstream in deploy/nginx.conf instead of proxy_pass http://127.0.0.1:8080 (proxy_pass http://horse;).
upstream horse {
  server 10.0.0.11:8080 max_fails=1 fail_timeout=5s;
  server 10.0.0.12:8080 max_fails=1 fail_timeout=5s;
}

# in the location blocks:
#   proxy_pass http://horse;
#   proxy_next_upstream error timeout http_503;     # GET requests only; a bet (POST) is never replayed on the other server
#   proxy_connect_timeout 2s;
#
# Uptime / load balancer check: GET /healthz on both machines (200 = active and healthy, 503 = standby or unhealthy).
