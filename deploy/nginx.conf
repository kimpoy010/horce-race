# /etc/nginx/conf.d/horse-race.conf  (certificates e.g. from certbot --nginx)
limit_req_zone $binary_remote_addr zone=hr_api:10m rate=20r/s;

server {
  listen 80;
  server_name game.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name game.example.com;
  ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "no-referrer" always;       # the launch token is in the URL
  client_max_body_size 100k;

  # operator pages: only from your office / VPN addresses
  location ~ ^/(controller|api/admin|api/report|api/command) {
    allow 203.0.113.10;     # <- your IP(s)
    deny all;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /api/ {
    limit_req zone=hr_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
  }
}
